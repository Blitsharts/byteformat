[project]
name = "byteformat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Blitsharts", email = "mark@woftam.net" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
extend-select = ["I", "B"]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]